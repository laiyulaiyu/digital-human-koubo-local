name: Import verified local v0.1.0 bundle
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'laiyulaiyu/digital-human-koubo-local' && github.actor == 'laiyulaiyu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the published bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/laiyulaiyu/digital-human-koubo-local/releases/download/v0.1.0/digital-human-koubo-local-v0.1.0.zip' --output "$RUNNER_TEMP/bundle.zip"
          echo '7c5cc9d10eccb8abe186cb9b986d5e865039b91e8523ccab5b104972b52d17d9  '"$RUNNER_TEMP/bundle.zip" | sha256sum --check
      - name: Import source files, preserving repository history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, zipfile
          from pathlib import Path, PurePosixPath
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP']) / 'bundle.zip') as archive:
              files = [info for info in archive.infolist() if not info.is_dir()]
              assert len(files) == 928, 'Unexpected file count'
              for info in files:
                  parts = PurePosixPath(info.filename).parts
                  assert parts[0] == 'digital-human-koubo-local-v0.1.0' and not any(p in ('..', '.git') for p in parts), 'Unsafe path'
                  rel = PurePosixPath(*parts[1:])
                  if str(rel).startswith('.github/workflows/'):
                      continue
                  target = Path.cwd().joinpath(*rel.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  data = archive.read(info)
                  target.write_bytes(data)
                  assert target.read_bytes() == data, str(rel)
          print('927 source files copied and verified; CI file will be added in the web editor')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Import verified local ComfyUI v0.1.0 source and demo assets'
            git push origin HEAD:main
          fi
      - name: Await web cleanup, verify every source file, and finalize tag
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 120); do
            git fetch origin main
            if ! git cat-file -e origin/main:.github/workflows/import-local-bundle.yml 2>/dev/null && git cat-file -e origin/main:.github/workflows/ci.yml 2>/dev/null; then
              ready=true
              break
            fi
            echo 'Awaiting removal of this temporary workflow and addition of the read-only CI file'
            sleep 5
          done
          test "$ready" = true
          git checkout --detach origin/main
          python - <<'PY'
          import os, subprocess, zipfile
          from pathlib import Path, PurePosixPath
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP']) / 'bundle.zip') as archive:
              expected = {}
              for info in archive.infolist():
                  if not info.is_dir():
                      rel = str(PurePosixPath(*PurePosixPath(info.filename).parts[1:]))
                      expected[rel] = archive.read(info)
          tracked = set(subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')) - {''}
          assert tracked == set(expected), 'Tracked file list differs from verified bundle'
          for rel, data in expected.items():
              assert Path(rel).read_bytes() == data, 'Source mismatch: ' + rel
          print('All 928 tracked files exactly match the verified release bundle')
          PY
          git push --force-with-lease=refs/tags/v0.1.0:a1e8407ae0cb4d69cb9442cf93517c0b1173f815 origin HEAD:refs/tags/v0.1.0
